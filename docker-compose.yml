services:
  ride-optimizer:
    image: ghcr.io/e2kd7n/ride-optimizer:latest
    container_name: ride-optimizer
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - APP_PORT=${APP_PORT:-8083}
      # Required: gunicorn now defaults to 127.0.0.1 (see gunicorn.conf.py) to avoid
      # binding all host interfaces for bare/dev runs. Inside this container that
      # default would break the "ports:" publish below, since podman/docker routes
      # host traffic to the container's bridge interface, not its loopback — so the
      # container must explicitly opt back into 0.0.0.0. LAN exposure is actually
      # controlled by the "ports:" mapping below, not this value.
      - BIND_HOST=0.0.0.0
      # Cap analysis worker processes: each ProcessPoolExecutor child forks a
      # full copy of the numpy stack, which pushed the Pi into swap. 1 = run
      # analysis sequentially in-process (RouteAnalyzer skips the pool).
      - ANALYSIS_N_WORKERS=${ANALYSIS_N_WORKERS:-1}
      - NTFY_ENABLED=${NTFY_ENABLED:-false}
      - NTFY_SERVER=${NTFY_SERVER:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-ride-optimizer}
      - NTFY_PRIORITY_CRITICAL=${NTFY_PRIORITY_CRITICAL:-urgent}
      - NTFY_PRIORITY_WARNING=${NTFY_PRIORITY_WARNING:-default}
      - NTFY_PRIORITY_INFO=${NTFY_PRIORITY_INFO:-low}

    # No host "ports:" publish here (#526) — caddy is the only thing exposed
    # to the LAN, and reaches this container over the compose network by
    # service name (see deploy/Caddyfile). Cron jobs run inside this same
    # container via `podman exec` and hit 127.0.0.1 directly, so they're
    # unaffected.
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./config:/app/config

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-8083}/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

    mem_limit: 512m
    cpus: "1.5"

  caddy:
    image: docker.io/library/caddy:2-alpine
    container_name: ride-optimizer-caddy
    restart: unless-stopped
    depends_on:
      - ride-optimizer

    environment:
      - APP_PORT=${APP_PORT:-8083}
      - CADDY_SITE_ADDRESS=${CADDY_SITE_ADDRESS:-https://pi4.local}

    ports:
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config

    mem_limit: 128m
    cpus: "0.5"
